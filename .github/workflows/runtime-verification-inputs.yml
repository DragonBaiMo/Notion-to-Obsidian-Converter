name: Runtime verification inputs
on:
  push:
    branches: [codex/sdk-toolchain-transfer]
    paths: [.github/workflows/runtime-verification-inputs.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Collect maintained Go and current compatible modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/extra/modules" "$RUNNER_TEMP/artifacts"
          cp -a "$(go env GOROOT)" "$RUNNER_TEMP/extra/go-toolchain"
          cd "$RUNNER_TEMP/extra/modules"
          go mod init companionshare
          printf 'package main\nimport (_ "github.com/coder/websocket"; _ "github.com/pion/turn/v4"; _ "github.com/pion/webrtc/v4")\nfunc main() {}\n' > main.go
          go get github.com/coder/websocket@latest github.com/pion/turn/v4@latest github.com/pion/webrtc/v4@latest
          go mod tidy
          go mod vendor
          go version > TOOLCHAIN.txt
          go list -m all > MODULES.txt
      - name: Encrypt Go transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/sdk-toolchain-transfer.yml').read_text()
          start=text.index('-----BEGIN CERTIFICATE-----')
          end=text.index('-----END CERTIFICATE-----',start)+len('-----END CERTIFICATE-----')
          Path('/tmp/recipient.pem').write_text('\n'.join(line.strip() for line in text[start:end].splitlines())+'\n')
          PY
          tar -C "$RUNNER_TEMP/extra" -czf "$RUNNER_TEMP/go.tar.gz" .
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/go.tar.gz" -outform DER -out "$RUNNER_TEMP/artifacts/go.cms" /tmp/recipient.pem
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-maintained-go
          path: ${{ runner.temp }}/artifacts/go.cms
          compression-level: 0
          retention-days: 1
      - name: Prepare Android 16 emulator input
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator 'system-images;android-36;google_apis;x86_64' > "$RUNNER_TEMP/emulator-install.log" 2>&1
          set -o pipefail
          test -f "$ANDROID_HOME/system-images/android-36/google_apis/x86_64/system.img"
          mkdir -p "$RUNNER_TEMP/avd-input"
          cp -a "$ANDROID_HOME/emulator" "$RUNNER_TEMP/avd-input/"
          cp -a "$ANDROID_HOME/system-images/android-36/google_apis/x86_64" "$RUNNER_TEMP/avd-input/image"
          cp -a "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/avd-input/cmdline-tools"
          tar -C "$RUNNER_TEMP/avd-input" -czf "$RUNNER_TEMP/emulator.tar.gz" .
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/emulator.tar.gz" -outform DER -out "$RUNNER_TEMP/artifacts/emulator.cms" /tmp/recipient.pem
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-android16-emulator
          path: ${{ runner.temp }}/artifacts/emulator.cms
          compression-level: 0
          retention-days: 1
