name: Published dependency verification transfer
on:
  push:
    branches: [codex/sdk-toolchain-transfer]
    paths: [.github/workflows/sdk-toolchain-transfer.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Download published dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps/go" "$RUNNER_TEMP/deps/android"
          cd "$RUNNER_TEMP/deps/go"
          go mod init companionshare
          printf 'package main\nimport (_ "github.com/coder/websocket"; _ "github.com/pion/turn/v4"; _ "github.com/pion/webrtc/v4")\nfunc main() {}\n' > main.go
          go get github.com/coder/websocket@v1.8.13 github.com/pion/turn/v4@v4.0.0 github.com/pion/webrtc/v4@v4.0.13
          go mod tidy
          go mod vendor
          cd "$RUNNER_TEMP/deps/android"
          curl -fL --retry 2 --max-time 180 -o webrtc.aar https://repo.maven.apache.org/maven2/io/github/webrtc-sdk/android/150.7871.01/android-150.7871.01.aar
          curl -fL --retry 2 --max-time 90 -o okhttp.jar https://repo.maven.apache.org/maven2/com/squareup/okhttp3/okhttp/4.12.0/okhttp-4.12.0.jar
          curl -fL --retry 2 --max-time 90 -o okio.jar https://repo.maven.apache.org/maven2/com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar
          curl -fL --retry 2 --max-time 90 -o junit.jar https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fL --retry 2 --max-time 90 -o hamcrest.jar https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' > "$RUNNER_TEMP/sdk-install.log" 2>&1
          set -o pipefail
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          cp "$ANDROID_HOME/platforms/android-36/android.jar" .
          cp -a "$ANDROID_HOME/build-tools/36.0.0" build-tools
          cp -a "$ANDROID_HOME/platform-tools" platform-tools
          printf 'WebRTC 150.7871.01\nOkHttp 4.12.0\nOkio 3.6.0\nAPI 36 / build-tools 36.0.0\n' > VERSIONS.txt
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Encrypt transfer for the local recipient
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDKzCCAhOgAwIBAgIUQvQ9+jyiscmuUIbZA6Nk9ZvTaTEwDQYJKoZIhvcNAQEL
          BQAwJTEjMCEGA1UEAwwaZGVwZW5kZW5jeS1iYWNrdXAtdHJhbnNmZXIwHhcNMjYx
          MDEyMDIzMzA3WhcNMjYxMDE1MDIzMzA3WjAlMSMwIQYDVQQDDBpkZXBlbmRlbmN5
          LWJhY2t1cC10cmFuc2ZlcjCCASIwDQYJKoZIhvcNAQEBBQADggEPADCCAQoCggEB
          AM7sYK9NbJfg2BOLw0oU3Khl1LvsI2guxc8HoOuSPPFjVhr0Z03mBF0cinON+CwR
          6X8YKTBufhqJR9o/gHEcxuojKqXr+smU95CvhGluDroZ0xxaNFvFnQEgmSH/zCHu
          nO+0h0aYgsdaTxXj6bch7iblp3Y69WnIoa2HtYJCrHbgT4e5a1dYzaTLZA2vyxyx
          KsE1Rq8pz1cZxqcsSXRJMzWOOZtdEnydwlWwaZ9IY3+0NDcWLYyw5wt1vbiWITsH
          3u2aUSsMEQZkCvx3Kns4PtiLypvNtBQsGtQsW7z99fH8Z3YXlIxLsMq6PIE0n4aD
          /Daq3yFAr0zrCyjZiAEcn5cCAwEAAaNTMFEwHQYDVR0OBBYEFPagAz/Bkr2BC5Hk
          EgIxjwjVj2iqMB8GA1UdIwQYMBaAFPagAz/Bkr2BC5HkEgIxjwjVj2iqMA8GA1Ud
          EwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggEBAD7X5NJIX7ooDNkdG5jzbKil
          U1i1IR3r5WTUlu9l7uQBFo9Kqhd2fOdFb1fX61Cv59+0BO8A/zRs5cINB5dRiz/T
          OlpgTFMzDfi2NhCjJ/aKpPQ54JrIPFoAvGHP2ia1UEK+Xf+jXOg6WUJpFbPoWjLf
          bPGImHKuArQVvhAss9SL5828KVujmPfQzztDisKt+16wbcibh99rGP2UubgJGbKi
          AdXfm/kStDAqYvWxhYuNBC1S/zR8MFtEt94LNIrgOaNC09CszWS8TZvSQrMeI0OT
          k/CU1euxzRst3YBdCvjIn/TNdNnlnaErvu2fXYM1I3LcW5n8sRRrX22FatLciSc=
          -----END CERTIFICATE-----
          CERT
          tar -C "$RUNNER_TEMP/deps" -czf "$RUNNER_TEMP/deps.tar.gz" .
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/deps.tar.gz" -outform DER -out "$RUNNER_TEMP/deps.cms" "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-published-dependencies
          path: ${{ runner.temp }}/deps.cms
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
